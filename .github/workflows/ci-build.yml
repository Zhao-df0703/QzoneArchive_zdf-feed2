name: CI Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - run: npx tauri build --bundles nsis
      - name: Rename artifacts with platform prefix
        shell: pwsh
        run: |
          $dir = "src-tauri/target/release/bundle/nsis"
          Get-ChildItem "$dir/*.exe" | ForEach-Object {
            Rename-Item $_.FullName "windows_x64_$($_.Name)"
          }
      - uses: actions/upload-artifact@v4
        with:
          name: qzonearchive-windows-${{ github.sha }}
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 90

  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-apple-darwin
            artifact: macos-x64
            arch: x64
          - target: aarch64-apple-darwin
            artifact: macos-arm64
            arch: arm64
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: npm ci
      - run: npx tauri build --target ${{ matrix.target }} --bundles dmg
      - name: Rename artifacts with platform prefix
        run: |
          DMG_DIR="src-tauri/target/${{ matrix.target }}/release/bundle/dmg"
          for f in "$DMG_DIR"/*.dmg; do
            mv "$f" "$DMG_DIR/macos_${{ matrix.arch }}_$(basename "$f")"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: qzonearchive-${{ matrix.artifact }}-${{ github.sha }}
          path: src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
          if-no-files-found: error
          retention-days: 90

  linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            artifact: linux_x64
            runner: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            artifact: linux_arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            xdg-utils
      - run: npm ci
      - run: npx tauri build --target ${{ matrix.target }} --bundles appimage,deb,rpm
      - name: Rename Linux artifacts with platform prefix
        run: |
          set -euo pipefail
          BUNDLE_DIR="src-tauri/target/${{ matrix.target }}/release/bundle"
          PLATFORM="${{ matrix.artifact }}"  # e.g. linux_x64, linux_arm64
          for dir in appimage deb rpm; do
            [ -d "$BUNDLE_DIR/$dir" ] || continue
            for f in "$BUNDLE_DIR/$dir"/*; do
              [ -f "$f" ] || continue
              base="$(basename "$f")"
              mv "$f" "$BUNDLE_DIR/$dir/${PLATFORM}_${base}"
            done
          done
      - uses: actions/upload-artifact@v4
        with:
          name: qzonearchive-${{ matrix.artifact }}-${{ github.sha }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage
            src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb
            src-tauri/target/${{ matrix.target }}/release/bundle/rpm/*.rpm
          if-no-files-found: error
          retention-days: 90

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v4
        with:
          packages: ""
      - name: Install Android SDK packages
        run: |
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;27.0.12077973"
          echo "NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.0.12077973" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.0.12077973" >> "$GITHUB_ENV"
      - run: npm ci
      - run: npx tauri android build --target aarch64
      - name: Sign Android APK
        run: |
          unsigned_apk="src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release-unsigned.apk"
          signed_apk="src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release.apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign \
            --ks release.jks \
            --ks-key-alias key0 \
            --ks-pass pass:qzonearchive \
            --key-pass pass:qzonearchive \
            --out "$signed_apk" \
            "$unsigned_apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify "$signed_apk"
      - name: Rename artifact with platform prefix
        run: |
          APK_DIR="src-tauri/gen/android/app/build/outputs/apk/universal/release"
          mv "$APK_DIR/app-universal-release.apk" "$APK_DIR/android_arm64_app-universal-release.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: qzonearchive-android-${{ github.sha }}
          path: src-tauri/gen/android/app/build/outputs/apk/universal/release/android_arm64_*.apk
          if-no-files-found: error
          retention-days: 90

  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios
      - run: npm ci
      - run: npx tauri ios init --ci
      - run: npx tauri ios build --target aarch64 --ci --no-sign
      - name: Rename artifact with platform prefix
        run: |
          IPA_DIR="src-tauri/gen/apple"
          for f in "$IPA_DIR"/**/*.ipa; do
            mv "$f" "$IPA_DIR/ios_arm64_$(basename "$f")"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: qzonearchive-ios-unsigned-${{ github.sha }}
          path: src-tauri/gen/apple/**/*.ipa
          if-no-files-found: error
          retention-days: 90

  nixos:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v16
      - name: Build NixOS package
        run: nix build -L .#qzonearchive
      - name: Package Nix closure
        run: |
          mkdir -p dist/nix
          store_path="$(readlink -f result)"
          echo "$store_path" > dist/nix/store-path.txt
          mapfile -t closure_paths < <(nix-store -qR "$store_path")
          nix-store --export "${closure_paths[@]}" > dist/nix/qzonearchive.closure
          cat > dist/nix/install.sh <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          here="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"
          store_path="$(cat "$here/store-path.txt")"
          if [ -w /nix/store ]; then
            nix-store --option require-sigs false --import < "$here/qzonearchive.closure"
          else
            sudo nix-store --option require-sigs false --import < "$here/qzonearchive.closure"
          fi
          nix --extra-experimental-features "nix-command flakes" profile install "$store_path"
          echo "QzoneArchive installed. Run qzonearchive to start it."
          EOF
          chmod +x dist/nix/install.sh
          tar -czf dist/nixos_x64_qzonearchive-nixos-x86_64-linux.tar.gz -C dist/nix .
      - uses: actions/upload-artifact@v4
        with:
          name: qzonearchive-nixos-${{ github.sha }}
          path: dist/nixos_x64_*.tar.gz
          if-no-files-found: error
          retention-days: 90

  publish-nightly:
    needs: [windows, macos, linux, android, ios, nixos]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: qzonearchive-windows-${{ github.sha }}
          path: artifacts/windows
      - uses: actions/download-artifact@v7
        with:
          name: qzonearchive-macos-x64-${{ github.sha }}
          path: artifacts/macos-x64
      - uses: actions/download-artifact@v7
        with:
          name: qzonearchive-macos-arm64-${{ github.sha }}
          path: artifacts/macos-arm64
      - uses: actions/download-artifact@v7
        with:
          name: qzonearchive-linux-x64-${{ github.sha }}
          path: artifacts/linux-x64
      - uses: actions/download-artifact@v7
        with:
          name: qzonearchive-linux-arm64-${{ github.sha }}
          path: artifacts/linux-arm64
      - uses: actions/download-artifact@v7
        with:
          name: qzonearchive-android-${{ github.sha }}
          path: artifacts/android
      - uses: actions/download-artifact@v7
        with:
          name: qzonearchive-ios-unsigned-${{ github.sha }}
          path: artifacts/ios-unsigned
      - uses: actions/download-artifact@v7
        with:
          name: qzonearchive-nixos-${{ github.sha }}
          path: artifacts/nixos
      - name: Publish nightly pre-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p nightly
          cp artifacts/windows/*.exe nightly/
          cp artifacts/macos-x64/*.dmg nightly/
          cp artifacts/macos-arm64/*.dmg nightly/
          cp artifacts/linux-x64/linux_x64_*.AppImage nightly/
          cp artifacts/linux-x64/linux_x64_*.deb nightly/
          cp artifacts/linux-x64/linux_x64_*.rpm nightly/
          cp artifacts/linux-arm64/linux_arm64_*.AppImage nightly/
          cp artifacts/linux-arm64/linux_arm64_*.deb nightly/
          cp artifacts/android/*.apk nightly/
          cp artifacts/ios-unsigned/*.ipa nightly/
          cp artifacts/nixos/*.tar.gz nightly/
          ls -lh nightly
          gh release create nightly \
            --repo "$GITHUB_REPOSITORY" \
            --title "Nightly CI Build" \
            --notes "最新 main 分支的全平台测试构建（pre-release）。文件名为固定名称，可通过上方下载链接直接获取。" \
            --prerelease 2>/dev/null || true
          gh release upload nightly \
            --repo "$GITHUB_REPOSITORY" \
            --clobber \
            nightly/*
