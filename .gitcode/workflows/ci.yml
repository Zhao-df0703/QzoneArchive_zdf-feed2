name: CI Build

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    name: Build Linux
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: checkout
      - name: Setup Node.js
        uses: setup-node
        with:
          node-version: '22'
      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libgtk-3-dev fonts-noto-cjk
      - name: Install dependencies
        run: cd repo_workspace && npm ci
      - name: Build
        run: cd repo_workspace && npx tauri build --bundles appimage,deb,rpm
